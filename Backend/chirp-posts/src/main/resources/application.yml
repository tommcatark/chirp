# ==================== chirp-posts 内容服务配置 ====================
server:
  port: 8082

spring:
  application:
    name: chirp-posts

  datasource:
    url: jdbc:postgresql://localhost:5432/chirp
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: 192.168.121.131:9092,192.168.121.132:9092,192.168.121.133:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

chirp:
  jwt:
    secret: ${CHIRP_JWT_SECRET:chirp-dev-jwt-secret-0123456789abcdef-please-change}
    expiration-millis: 604800000

logging:
  level:
    com.chirp.posts: DEBUG