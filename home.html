<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07211a" />
    <title>鸣 Chirp · 首页</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230e9f6e'/%3E%3Crect x='5' y='10' width='3.4' height='8' rx='1.7' fill='white'/%3E%3Crect x='10.3' y='5.5' width='3.4' height='13' rx='1.7' fill='white'/%3E%3Crect x='15.6' y='9' width='3.4' height='9.5' rx='1.7' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="app-body">
    <div class="app-shell">
      <!-- ============ 左侧导航 ============ -->
      <aside class="side-nav">
        <a class="brand-mark app-brand" href="/home.html" aria-label="鸣 Chirp 首页">
          <span class="brand-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="4" y="9" width="4" height="10" rx="2" />
              <rect x="10" y="4" width="4" height="15" rx="2" />
              <rect x="16" y="7" width="4" height="12" rx="2" />
            </svg>
          </span>
          <span class="brand-name">鸣 <em>Chirp</em></span>
        </a>

        <nav class="nav-list" aria-label="主导航">
          <a class="nav-item active" href="/home.html">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5" /></svg>
            <span>首页</span>
          </a>
          <a class="nav-item" href="#explore">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <span>探索</span>
          </a>
          <a class="nav-item" href="#notifications">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" /><path d="M10.3 21a2 2 0 0 0 3.4 0" /></svg>
            <span>通知</span>
            <i class="nav-badge">3</i>
          </a>
          <a class="nav-item" href="#messages">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l.9-4.4A8 8 0 1 1 21 12Z" /></svg>
            <span>消息</span>
          </a>
          <a class="nav-item" href="#bookmarks">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4Z" /></svg>
            <span>收藏</span>
          </a>
          <a class="nav-item" href="/profile.html">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" /></svg>
            <span>个人主页</span>
          </a>
        </nav>

        <button class="compose-cta" id="compose-cta" type="button">发布新声</button>

        <div class="me-card" id="me-card">
          <div class="avatar avatar-lg" id="me-avatar">我</div>
          <div class="me-meta">
            <strong id="me-name">我</strong>
            <span id="me-email">@me</span>
          </div>
          <button class="logout-btn" id="logout-btn" type="button" title="退出登录" aria-label="退出登录">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" /><path d="M10 17l-5-5 5-5M5 12h12" /></svg>
          </button>
        </div>
      </aside>

      <!-- ============ 中间主内容 ============ -->
      <main class="feed-column">
        <header class="feed-header">
          <h1>首页</h1>
          <div class="feed-tabs" role="tablist" aria-label="信息流">
            <button class="feed-tab active" type="button" data-tab="all" role="tab" aria-selected="true">推荐</button>
            <button class="feed-tab" type="button" data-tab="following" role="tab" aria-selected="false">关注</button>
          </div>
        </header>

        <!-- 发布框 -->
        <section class="composer">
          <div class="avatar avatar-lg" id="composer-avatar">我</div>
          <div class="composer-main">
            <textarea id="composer-input" maxlength="280" rows="3" placeholder="此刻，你想鸣响什么？"></textarea>
            <div class="composer-bar">
              <div class="composer-tools" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" /><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01" /></svg>
                <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="8.5" cy="10.5" r="1.5" /><path d="m4 17 5-4 4 3 3-2 4 3" /></svg>
                <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" /><path d="M8 12h8M12 8v8" /></svg>
              </div>
              <div class="composer-send">
                <span class="char-count" id="char-count">280</span>
                <button class="post-btn" id="post-btn" type="button" disabled>发布</button>
              </div>
            </div>
            <p class="composer-status" id="composer-status" role="status"></p>
          </div>
        </section>

        <!-- 信息流加载状态（在 feed 外，避免 renderFeed 覆盖） -->
        <p class="feed-loading" id="feed-loading">正在加载时间流…</p>

        <!-- 信息流 -->
        <section class="feed" id="feed" aria-label="时间流"></section>

        <!-- 加载失败 -->
        <div class="empty-state hidden" id="feed-error">
          <div class="empty-mark">
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 8v5M12 16.5h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></svg>
          </div>
          <h2>时间流加载失败</h2>
          <p>暂时无法连接服务器，请确认后端服务已启动。<br /><button class="retry-btn" id="retry-btn" type="button">重新加载</button></p>
        </div>

        <!-- 关注为空 -->
        <div class="empty-state hidden" id="empty-following">
          <div class="empty-mark">
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M17 8a5 5 0 1 0-10 0c0 5.8-2.5 7-2.5 8.5h15C19.5 15 17 13.8 17 8Z" /></svg>
          </div>
          <h2>关注流还是静的</h2>
          <p>去右侧「你可能感兴趣的人」关注一些声音，这里就会热闹起来。</p>
        </div>
      </main>

      <!-- ============ 右侧信息栏 ============ -->
      <aside class="info-column">
        <label class="search-box">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input type="search" id="search-input" placeholder="搜索鸣 Chirp" aria-label="搜索" />
        </label>

        <section class="side-card">
          <h3>正在鸣响</h3>
          <ul class="trend-list" id="trend-list"></ul>
        </section>

        <section class="side-card">
          <h3>你可能感兴趣的人</h3>
          <ul class="suggest-list" id="suggest-list"></ul>
          <a class="side-more" href="#explore">查看全部 →</a>
        </section>

        <footer class="side-footer">
          <a href="#">服务条款</a><a href="#">隐私政策</a><a href="#">帮助中心</a>
          <span>© 2026 Chirp</span>
        </footer>
      </aside>
    </div>

    <script src="/home.js"></script>
  </body>
</html>
