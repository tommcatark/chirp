<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0A1F" />
  <title>消息 · 鸣 Chirp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%23FF7AC6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Crect x='5' y='10' width='3.4' height='8' rx='1.7' fill='%230B0A1F'/%3E%3Crect x='10.3' y='5.5' width='3.4' height='13' rx='1.7' fill='%230B0A1F'/%3E%3Crect x='15.6' y='9' width='3.4' height='9.5' rx='1.7' fill='%230B0A1F'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dream-theme.css" />
</head>
<body class="profile-page messages-page">
  <main class="profile-wrap">
    <header class="profile-topbar">
      <a class="brand-mark app-brand" href="/home.html" aria-label="返回首页">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0e9f6e"/><rect x="5" y="10" width="3.4" height="8" rx="1.7" fill="#fff"/><rect x="10.3" y="5.5" width="3.4" height="13" rx="1.7" fill="#fff"/><rect x="15.6" y="9" width="3.4" height="9.5" rx="1.7" fill="#fff"/></svg>
        <strong>鸣 Chirp</strong>
      </a>
      <a class="back-link" href="/home.html">← 返回首页</a>
    </header>

    <!-- 消息头部：标题 + 未读数 -->
    <section class="msg-head">
      <h1>消息</h1>
      <span class="notif-unread hidden" id="msg-unread">0 条未读</span>
    </section>

    <!-- 会话列表视图 -->
    <section id="conv-view">
      <p class="feed-loading" id="conv-loading">正在加载…</p>
      <ul class="conv-list" id="conv-list"></ul>
      <div class="empty-state hidden" id="conv-empty">
        <div class="empty-mark">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l.9-4.4A8 8 0 1 1 21 12Z" /></svg>
        </div>
        <h3>还没有私信</h3>
        <p>去探索页找感兴趣的人，发起第一段对话吧。</p>
      </div>
    </section>

    <!-- 聊天视图 -->
    <section id="chat-view" class="hidden">
      <header class="chat-head">
        <button class="chat-back" id="chat-back" type="button" aria-label="返回会话列表">←</button>
        <div class="avatar" id="chat-avatar">?</div>
        <div class="chat-peer">
          <strong id="chat-name"></strong>
          <span class="handle" id="chat-handle"></span>
        </div>
      </header>

      <div class="chat-body" id="chat-body">
        <button class="notif-load-more hidden" id="chat-more-btn" type="button">加载更早消息</button>
        <p class="feed-loading" id="chat-loading">正在加载…</p>
        <ul class="msg-list" id="msg-list"></ul>
      </div>

      <form class="chat-composer" id="chat-form">
        <textarea id="chat-input" maxlength="500" rows="1" placeholder="发送私信…" aria-label="消息内容"></textarea>
        <button class="post-btn" id="chat-send" type="submit" disabled>发送</button>
      </form>
    </section>
  </main>

  <script src="/messages.js"></script>
  <script src="/motion.js"></script>
</body>
</html>
