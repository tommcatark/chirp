<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0A1F" />
  <title>通知 · 鸣 Chirp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%23FF7AC6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Crect x='5' y='10' width='3.4' height='8' rx='1.7' fill='%230B0A1F'/%3E%3Crect x='10.3' y='5.5' width='3.4' height='13' rx='1.7' fill='%230B0A1F'/%3E%3Crect x='15.6' y='9' width='3.4' height='9.5' rx='1.7' fill='%230B0A1F'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dream-theme.css" />
</head>
<body class="profile-page notifications-page">
  <main class="profile-wrap">
    <header class="profile-topbar">
      <a class="brand-mark app-brand" href="/home.html" aria-label="返回首页">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0e9f6e"/><rect x="5" y="10" width="3.4" height="8" rx="1.7" fill="#fff"/><rect x="10.3" y="5.5" width="3.4" height="13" rx="1.7" fill="#fff"/><rect x="15.6" y="9" width="3.4" height="9.5" rx="1.7" fill="#fff"/></svg>
        <strong>鸣 Chirp</strong>
      </a>
      <a class="back-link" href="/home.html">← 返回首页</a>
    </header>

    <!-- 通知头部：标题 + 未读数 + 全部已读 -->
    <section class="notif-head">
      <h1>通知</h1>
      <span class="notif-unread hidden" id="unread-count">0 条未读</span>
      <button class="notif-mark-all" id="mark-all-btn" type="button" disabled>全部标为已读</button>
    </section>

    <!-- 通知列表 -->
    <section>
      <p class="feed-loading" id="notif-loading">正在加载…</p>
      <ul class="notif-list" id="notif-list"></ul>
      <div class="empty-state hidden" id="notif-empty">
        <div class="empty-mark">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" /><path d="M10.3 21a2 2 0 0 0 3.4 0" /></svg>
        </div>
        <h3>还没有通知</h3>
        <p>当有人关注你、赞或评论你的鸣响时，会出现在这里。</p>
      </div>
      <button class="notif-load-more hidden" id="load-more-btn" type="button">加载更多</button>
    </section>
  </main>

  <script src="/notifications.js"></script>
  <script src="/motion.js"></script>
</body>
</html>
