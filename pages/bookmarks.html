<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0A1F" />
  <title>收藏 · 鸣 Chirp</title>

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/dream-theme.css" />
</head>
<body class="profile-page bookmarks-page">
  <main class="profile-wrap">
    <header class="profile-topbar">
      <a class="brand-mark app-brand" href="/pages/home.html" aria-label="返回首页">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0e9f6e"/><rect x="5" y="10" width="3.4" height="8" rx="1.7" fill="#fff"/><rect x="10.3" y="5.5" width="3.4" height="13" rx="1.7" fill="#fff"/><rect x="15.6" y="9" width="3.4" height="9.5" rx="1.7" fill="#fff"/></svg>
        <strong>鸣 Chirp</strong>
      </a>
      <a class="back-link" href="/pages/home.html">← 返回首页</a>
    </header>

    <!-- 收藏头部 -->
    <section class="bm-head">
      <h1>收藏</h1>
      <span class="bm-count hidden" id="bm-count">0 条</span>
    </section>

    <!-- 收藏列表 -->
    <section>
      <p class="feed-loading" id="bm-loading">正在加载…</p>
      <div class="bm-list" id="bm-list"></div>
      <div class="empty-state hidden" id="bm-empty">
        <div class="empty-mark">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4Z" /></svg>
        </div>
        <h3>还没有收藏</h3>
        <p>在鸣响下方点一下收藏，之后就能在这里找到它。</p>
      </div>
      <button class="bm-load-more hidden" id="bm-more" type="button">加载更多</button>
    </section>
  </main>

  <script src="/js/bookmarks.js"></script>
  <script src="/js/motion.js"></script>
</body>
</html>
