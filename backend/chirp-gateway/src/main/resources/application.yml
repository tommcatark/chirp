# ==================== chirp-gateway 配置 ====================
server:
  port: 8080

spring:
  application:
    name: chirp-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        register-enabled: true
      config:
        import-check:
          enabled: false

    gateway:
      routes:
        - id: chirp-auth-route
          uri: lb://chirp-auth
          predicates:
            - Path=/api/auth/**

        - id: chirp-posts-route
          uri: lb://chirp-auth
          predicates:
            - Path=/api/posts/**

        - id: chirp-users-route
          uri: lb://chirp-auth
          predicates:
            - Path=/api/users/**

        - id: chirp-comments-route
          uri: lb://chirp-auth
          predicates:
            - Path=/api/comments/**

        - id: chirp-notifications-route
          uri: lb://chirp-auth
          predicates:
            - Path=/api/notifications/**

        - id: chirp-search-route
          uri: lb://chirp-auth
          predicates:
            - Path=/api/search/**

        - id: chirp-hashtags-route
          uri: lb://chirp-auth
          predicates:
            - Path=/api/hashtags/**

app:
  cors-origin: http://localhost:4173

chirp:
  jwt:
    secret: ${CHIRP_JWT_SECRET:chirp-dev-jwt-secret-0123456789abcdef-please-change}
    expiration-millis: 604800000

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO